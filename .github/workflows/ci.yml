name: CI

on:
  push:
    branches: [feat/public-enrollment, main]
  pull_request:

# Annule les runs obsolètes d'une même branche/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Garde-fou : un package-lock.json régénéré sur un seul OS (ex. macOS) perd
      # les binaires natifs des autres plateformes (bug npm/cli#4828), ce qui fait
      # planter rolldown/vitest sur Linux. On échoue tôt avec un message clair.
      - name: Vérifie un lockfile multi-plateforme (npm/cli#4828)
        run: |
          node -e "const p=require('./package-lock.json').packages; if(!p['node_modules/@rolldown/binding-linux-x64-gnu']){console.error('ERREUR: package-lock.json est mono-plateforme (binaires Linux manquants, bug npm/cli#4828). Regenere un lock complet: npm install --package-lock-only puis commite package-lock.json'); process.exit(1);} console.log('OK: lockfile multi-plateforme, binaires Linux presents');"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Valeurs FACTICES non-secrètes : les clients Supabase/Upstash/QR sont
          # instanciés au scope module (jettent si la var manque) mais ne sont
          # jamais APPELÉS pendant le build → aucune vraie clé requise.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy-token
          QR_SIGNATURE_SECRET: ci-dummy-qr-secret
