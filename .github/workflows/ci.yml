name: CI

on:
  push:
    branches: [feat/public-enrollment, main]
  pull_request:

# Annule les runs obsolètes d'une même branche/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install déterministe depuis le lock (versions figées → pas de dérive).
      - name: Install dependencies
        run: npm ci

      # Bug npm/cli#4828 : un package-lock.json généré sur macOS ne référence pas
      # les binaires natifs Linux (rolldown/vitest, @next/swc, sharp, oxide,
      # lightningcss, @unrs, @rollup) → ils manquent sur le runner après `npm ci`.
      # On les ajoute explicitement aux versions DÉJÀ figées dans le lock : la
      # liste est dérivée du lock (donc auto-maintenue) et node_modules est déjà
      # peuplé par `npm ci`, donc aucune autre dépendance n'est modifiée.
      - name: Ajoute les binaires natifs Linux manquants (npm/cli#4828)
        run: |
          PKGS=$(node -e 'const l=require("./package-lock.json").packages;const out=[];for(const k of Object.keys(l)){if(!k.endsWith("-darwin-arm64"))continue;const base=k.slice("node_modules/".length,-"-darwin-arm64".length);out.push((base.startsWith("@img/sharp")?base+"-linux-x64":base+"-linux-x64-gnu")+"@"+l[k].version);}process.stdout.write(out.join(" "));')
          echo "Binaires Linux ajoutés : $PKGS"
          # PAS de --no-package-lock : on garde le lock comme référence pour figer
          # toutes les autres deps (sinon npm ré-résout et dérive le tooling lint).
          npm install --no-save --no-audit --no-fund $PKGS

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests (Vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Valeurs FACTICES non-secrètes : les clients Supabase/Upstash/QR sont
          # instanciés au scope module (jettent si la var manque) mais ne sont
          # jamais APPELÉS pendant le build → aucune vraie clé requise.
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-dummy-token
          QR_SIGNATURE_SECRET: ci-dummy-qr-secret
